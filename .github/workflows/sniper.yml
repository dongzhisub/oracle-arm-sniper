name: Oracle ARM Instance Sniper

# 来源: https://www.nodeloc.com/t/topic/98502
# 用法见仓库根目录 README.md

on:
  workflow_dispatch:        # 支持在 Actions 面板手动 Run workflow
  schedule:
    - cron: '*/15 * * * *'  # 每 15 分钟自动尝试一次

permissions:
  contents: read
  administration: write   # 允许抢到后通过 API 自动禁用本 workflow

jobs:
  sniper:
    name: ARM Instance Sniper
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false

    env:
      GH_TOKEN: ${{ github.token }}
      OCI_TENANCY: ${{ secrets.TENANCY_OCID }}
      OCI_REGION: ${{ secrets.REGION }}
      SUBNET_ID: ${{ secrets.SUBNET_ID }}
      SSH_PUB_KEY: ${{ secrets.USER_SSH_PUB_KEY }}
      # 机型配置: 真 2核12G(免费额度 4C24G 的一半, 以后还能再开一台小的)。
      # 想单实例拿满全量额度就改成: '{"ocpus":4,"memoryInGBs":24}'
      SHAPE_CONFIG: '{"ocpus":2,"memoryInGBs":12}'
      # 目标系统镜像(帖子默认 Ubuntu 24.04)
      OS_NAME: "Canonical Ubuntu"
      OS_VERSION: "24.04"

    steps:
      - name: Install OCI CLI
        run: |
          curl -L -O https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
          chmod +x install.sh
          ./install.sh --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Setup OCI Config
        env:
          OCI_USER: ${{ secrets.USER_OCID }}
          OCI_FP: ${{ secrets.FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${OCI_USER}
          fingerprint=${OCI_FP}
          tenancy=${OCI_TENANCY}
          region=${OCI_REGION}
          key_file=~/.oci/key.pem
          EOF
          echo "${OCI_PRIVATE_KEY}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem ~/.oci/config

      - name: Fixed-Key Sentry Loop
        run: |
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          START_TIME=$(date +%s)

          mkdir -p ~/.ssh
          echo "${SSH_PUB_KEY}" > ~/.ssh/id_rsa_oracle.pub

          # 抢到后禁用本 workflow, cron 从此不再触发
          disable_workflow() {
            echo "[GUARD] Disabling workflow to stop future runs..."
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/sniper.yml/disable" >/dev/null 2>&1; then
              echo "[GUARD] Workflow disabled. No more scheduled runs. DONE!"
            else
              echo "[GUARD][WARN] Auto-disable failed. Please disable it manually in repo Settings/Actions!"
            fi
          }

          # 哨兵检查: 已有存活的 A1 实例说明之前抢到过, 直接收工
          EXISTING=$(oci compute instance list --compartment-id "${OCI_TENANCY}" --all 2>/dev/null | jq -r '[.data[] | select(.shape == "VM.Standard.A1.Flex" and .["lifecycle-state"] != "TERMINATED")][0].id // empty')
          if [ -n "$EXISTING" ]; then
            echo "[ALREADY-OWNED] Existing A1 instance found: ${EXISTING}"
            disable_workflow
            exit 0
          fi

          AD_LIST=$(oci iam availability-domain list --compartment-id "${OCI_TENANCY}" --query "data[*].name" --raw-output | jq -r '.[]' | sort)
          IMAGE_ID=$(oci compute image list --compartment-id "${OCI_TENANCY}" --operating-system "${OS_NAME}" --operating-system-version "${OS_VERSION}" --shape "VM.Standard.A1.Flex" --sort-by TIMECREATED --query 'data[0].id' --raw-output)

          echo "=== Oracle ARM Sniper Template V1.0 ==="
          echo "[AD] Target ADs: $(echo $AD_LIST | tr '\n' ' ')"
          echo "[IMG] Target Image: ${IMAGE_ID}"

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$(( CURRENT_TIME - START_TIME ))

            if [ $ELAPSED -gt 2700 ]; then
              echo "[TIMEOUT] Reached 45m limit. Exiting safely."
              exit 0
            fi

            for ad in $AD_LIST; do
              echo "[TRY] $ad | Elapsed: ${ELAPSED}s"

              if oci compute instance launch \
                --availability-domain "$ad" \
                --compartment-id "${OCI_TENANCY}" \
                --shape "VM.Standard.A1.Flex" \
                --shape-config "${SHAPE_CONFIG}" \
                --image-id "$IMAGE_ID" \
                --subnet-id "${SUBNET_ID}" \
                --ssh-authorized-keys-file ~/.ssh/id_rsa_oracle.pub \
                --assign-public-ip true \
                --display-name "SNIPER-$(date +%m%d_%H%M)" \
                --wait-for-state RUNNING --max-wait-seconds 1 \
                >/dev/null 2>/dev/null; then

                echo "[SUCCESS] instance created in $ad (config: ${SHAPE_CONFIG})"
                disable_workflow
                exit 0
              else
                echo "$ad: No stock"
              fi

              sleep 5
            done
            sleep 30
          done
